<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Compras · Sistema Integrado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --white: #FFFFFF;
      --bg: #F3F7FA;
      --bg-deep: #EAF1F6;
      --ink: #132433;
      --ink-soft: #5B6B78;
      --ink-faint: #8C99A5;
      --blue-deep: #0A3D62;
      --blue: #1C77C3;
      --blue-mid: #2E8BD9;
      --blue-soft: #E7F2FB;
      --green: #1E9E6D;
      --green-soft: #E4F7EF;
      --yellow: #F4B400;
      --yellow-soft: #FDF3D9;
      --red: #C0392B;
      --red-soft: #FBE7E4;
      --border: #DCE6ED;
      --shadow: 0 10px 34px rgba(10,61,98,0.10);
      --radius-lg: 22px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #E9F2FB 0%, transparent 55%), radial-gradient(1000px 550px at 100% 105%, #E7F7EE 0%, transparent 55%), var(--bg-deep);
      color: var(--ink);
      min-height: 100vh;
      padding: 26px 20px 50px;
    }

    h1, h2, h3, .display { font-family: 'Space Grotesk', sans-serif; }

    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      display: flex;
      overflow: hidden;
      min-height: 900px;
      border: 1px solid var(--border);
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: linear-gradient(185deg, var(--blue-deep), #0d4a76 60%, var(--blue));
      color: #fff;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .side-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 32px;
      padding: 0 4px;
    }

    .side-brand .logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
    }

    .side-brand .name {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.2;
    }

    .side-brand .sub {
      font-size: 10px;
      color: rgba(255,255,255,0.65);
      margin-top: 2px;
    }

    .side-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 20px;
    }

    .side-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 13px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      color: rgba(255,255,255,0.72);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .side-item .ic {
      width: 20px;
      text-align: center;
      font-size: 16px;
    }

    .side-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .side-item.active { background: rgba(255,255,255,0.16); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); }

    .side-spacer { flex: 1; }

    /* MAIN */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .topbar h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }

    .topbar .d {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    .content {
      padding: 22px 28px 32px;
      overflow-y: auto;
      flex: 1;
    }

    /* KPI GRID */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      position: relative;
    }

    .kpi-card .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .kpi-card .ic {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .kpi-card.blue .ic { background: var(--blue-soft); color: var(--blue); }
    .kpi-card.yellow .ic { background: var(--yellow-soft); color: #a06e00; }
    .kpi-card.green .ic { background: var(--green-soft); color: var(--green); }
    .kpi-card.red .ic { background: var(--red-soft); color: var(--red); }

    .kpi-card .num {
      font-family: 'Space Grotesk';
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
    }

    .kpi-card .lbl {
      font-size: 10.5px;
      color: var(--ink-soft);
      margin-top: 2px;
      font-weight: 600;
    }

    .kpi-card .note {
      font-size: 10px;
      color: var(--ink-faint);
      margin-top: 1px;
    }

    /* TABS */
    .tabs-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .tab-btn .cnt {
      background: var(--white);
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 9px;
      font-family: 'IBM Plex Mono';
      color: var(--ink-faint);
    }

    .tab-btn:hover { background: var(--border); }
    .tab-btn.active {
      background: var(--blue-deep);
      border-color: var(--blue-deep);
      color: #fff;
    }

    .tab-btn.active .cnt {
      background: rgba(255,255,255,0.18);
      color: #fff;
    }

    /* FILTER ROW */
    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-select {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--ink);
      font-family: 'Inter';
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-select:hover { border-color: var(--blue); }
    .filter-select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(28,119,195,0.1); }

    /* TABLE */
    .table-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: auto;
      max-height: 550px;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    table thead th {
      text-align: left;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-faint);
      font-weight: 700;
      padding: 11px 10px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    table thead th:hover { background: var(--bg-deep); }

    table td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      vertical-align: middle;
    }

    table tbody tr:last-child td { border-bottom: none; }
    table tbody tr:hover { background: #FAFCFE; }

    /* TYPE CHIPS */
    .type-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .type-ic {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .badge-success { background: var(--green-soft); color: var(--green); }
    .badge-warning { background: var(--yellow-soft); color: #a06e00; }
    .badge-danger { background: var(--red-soft); color: var(--red); }
    .badge-info { background: var(--blue-soft); color: var(--blue-deep); }

    .urgency-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 700;
    }

    .urgency-badge.urgent { background: var(--red-soft); color: var(--red); }
    .urgency-badge.normal { background: var(--green-soft); color: var(--green); }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.urgent { background: var(--red); }
    .dot.normal { background: var(--green); }

    /* DETAIL PANE */
    .detail-pane {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
      padding: 14px 12px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    .detail-section h4 {
      font-family: 'Space Grotesk';
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--blue-deep);
      margin: 0 0 10px;
      letter-spacing: 0.04em;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 11.5px;
      border-bottom: 1px solid var(--border);
    }

    .detail-item .label { color: var(--ink-soft); font-weight: 500; }
    .detail-item .value { color: var(--ink); font-weight: 600; }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      grid-column: 1 / -1;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 9px;
      font-family: 'Inter';
      font-weight: 700;
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-approve { background: var(--green); color: white; }
    .btn-approve:hover { background: #187d5f; }

    .btn-reject { background: var(--red); color: white; }
    .btn-reject:hover { background: #a93026; }

    .btn-secondary { background: var(--yellow); color: #5a4206; }
    .btn-secondary:hover { background: #d9a200; }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 24px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .modal-title {
      font-family: 'Space Grotesk';
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 16px;
      color: var(--ink);
    }

    .modal-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 6px;
      display: block;
    }

    .modal-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-family: 'Inter';
      font-size: 12px;
      color: var(--ink);
      resize: vertical;
      min-height: 100px;
      margin-bottom: 16px;
    }

    .modal-textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(28,119,195,0.1); }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 9px 16px;
      border: none;
      border-radius: 9px;
      font-family: 'Inter';
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-btn-confirm { background: var(--blue); color: white; }
    .modal-btn-confirm:hover { background: var(--blue-deep); }

    .modal-btn-cancel { background: var(--bg); color: var(--ink); border: 1px solid var(--border); }
    .modal-btn-cancel:hover { background: var(--border); }

    /* PROVIDER CARDS */
    .provider-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      grid-column: 1 / -1;
      margin-top: 10px;
    }

    .provider-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
      font-size: 11px;
    }

    .provider-card.highlight {
      border: 2px solid var(--blue);
      background: var(--blue-soft);
    }

    .provider-name {
      font-weight: 700;
      font-size: 11.5px;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .provider-price {
      font-family: 'IBM Plex Mono';
      font-size: 16px;
      font-weight: 700;
      color: var(--blue-deep);
      margin-bottom: 6px;
    }

    .provider-detail {
      font-size: 10px;
      color: var(--ink-soft);
      padding: 2px 0;
    }

    /* AI SUGGESTION */
    .ai-suggestion {
      grid-column: 1 / -1;
      background: var(--blue-soft);
      border-left: 4px solid var(--blue);
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 10px;
    }

    .ai-suggestion.critical {
      background: var(--red-soft);
      border-left-color: var(--red);
    }

    .ai-suggestion-title {
      font-weight: 700;
      font-size: 11.5px;
      color: var(--blue-deep);
      margin-bottom: 3px;
    }

    .ai-suggestion.critical .ai-suggestion-title {
      color: var(--red);
    }

    .ai-suggestion-text {
      font-size: 11px;
      line-height: 1.4;
      color: var(--ink);
    }

    /* CHARTS */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .chart-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
    }

    .chart-card h3 {
      font-family: 'Space Grotesk';
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 14px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .chart-container {
      position: relative;
      height: 250px;
    }

    .page { display: none; }
    .page.active { display: block; }

    .sort-indicator {
      display: inline-block;
      margin-left: 4px;
      font-size: 9px;
    }

    .row-toggle {
      background: none;
      border: none;
      color: var(--blue);
      cursor: pointer;
      font-weight: 700;
      padding: 0;
      min-width: 18px;
      font-size: 12px;
    }

    .num-right {
      text-align: right;
      font-family: 'IBM Plex Mono';
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="sidebar">
      <div class="side-brand">
        <div class="logo">📦</div>
        <div>
          <div class="name">Gestión</div>
          <div class="sub">Compras</div>
        </div>
      </div>

      <div class="side-nav">
        <div class="side-item active" onclick="setPortal('portal1'); updateNav(0)">
          <span class="ic">✓</span>
          <span>Autorizaciones</span>
        </div>
        <div class="side-item" onclick="setPortal('portal2'); updateNav(1)">
          <span class="ic">💰</span>
          <span>Aprobación</span>
        </div>
        <div class="side-item" onclick="setPortal('portal3'); updateNav(2)">
          <span class="ic">📊</span>
          <span>Dashboard</span>
        </div>
      </div>

      <div class="side-spacer"></div>
    </div>

    <div class="main">
      <div class="topbar">
        <div>
          <h1 id="page-title">Autorizaciones de Pedidos</h1>
          <p class="d" id="page-desc">Validación de solicitudes de compra</p>
        </div>
      </div>

      <div class="content">
        <div id="portal1" class="page active">
          <div class="tabs-row" id="portal1-filters"></div>
          <div class="filter-row" id="portal1-filter-controls"></div>
          <div class="table-card">
            <table id="tabla1"></table>
          </div>
        </div>

        <div id="portal2" class="page">
          <div id="kpi-grid-p2" class="kpi-grid"></div>
          <div class="tabs-row" id="portal2-filters"></div>
          <div class="filter-row" id="portal2-filter-controls"></div>
          <div class="table-card">
            <table id="tabla2"></table>
          </div>
        </div>

        <div id="portal3" class="page">
          <div id="kpi-grid-p3" class="kpi-grid"></div>
          <div class="charts-grid" id="charts-container"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL PARA NOTAS -->
  <div id="noteModal" class="modal">
    <div class="modal-content">
      <h3 class="modal-title" id="modal-title">Agregar Nota</h3>

      <textarea id="modal-textarea" class="modal-textarea" placeholder="Ej: Presupuesto insuficiente, plazo no compatible, especificación a revisar..."></textarea>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="modal-btn modal-btn-confirm" onclick="confirmModalAction()">Guardar y Proceder</button>
      </div>
    </div>
  </div>

          <td style="max-width:60px;overflow:hidden;text-overflow:ellipsis">${s.marca}</td>
          <td><span class="status-badge badge-info">${s.sector}</span></td>
          <td class="num-right">${s.cantidad}</td>
          <td class="num-right">$${s.precioUnit.toLocaleString()}</td>
          <td class="num-right" style="font-weight:700">$${s.gasto.toLocaleString()}</td>
          <td><span class="urgency-badge ${isUrgentVal ? 'urgent' : 'normal'}"><span class="dot ${isUrgentVal ? 'urgent' : 'normal'}"></span>${isUrgentVal ? 'URG' : 'OK'}</span></td>
          <td><span class="status-badge ${criticalClass}">${s.criticidad.substring(0, 3)}</span></td>
          <td><span class="status-badge ${statusClass}">${s.estado.substring(0, 6)}</span></td>
        </tr>
        ${expanded ? `<tr class="detail-row"><td colspan="12"><div class="detail-pane"><div class="detail-section"><h4>Solicitud</h4><div class="detail-item"><span class="label">Código:</span><span class="value">${s.codigo}</span></div><div class="detail-item"><span class="label">Equipo:</span><span class="value">${s.equipo}</span></div><div class="detail-item"><span class="label">Total:</span><span class="value">$${s.gasto.toLocaleString()}</span></div></div><div class="detail-section"><h4>Contexto</h4><div class="detail-item"><span class="label">Stock:</span><span class="value" style="color: ${s.stock < s.puntoRepedido ? 'var(--red)' : 'var(--green)'};">${s.stock}</span></div><div class="detail-item"><span class="label">Punto Pedido:</span><span class="value">${s.puntoRepedido}</span></div><div class="detail-item"><span class="label">Fecha Deseada:</span><span class="value">${s.fechaDeseada}</span></div><div class="detail-item"><span class="label">Pedido Activo:</span><span class="value">${s.pedidoActivo ? '✓' : '✕'}</span></div></div>${s.estado === 'Pendiente' ? `<div class="actions"><button class="btn btn-approve" onclick="updateEstado('${s.id}', 'Aprobada')">✓ Aprobar</button><button class="btn btn-reject" onclick="openNoteModal('${s.id}', 'Rechazada', 'portal1')">✕ Rechazar</button><button class="btn btn-secondary" onclick="openNoteModal('${s.id}', 'Postergada', 'portal1')">⏸ Postergar</button></div>` : `<div style="grid-column: 1 / -1; padding: 8px; color: var(--ink-faint); font-size: 11px;">Estado: <strong>${s.estado}</strong>${s.nota ? ` | Nota: ${s.nota}` : ''}</div>`}</div></td></tr>` : ''}`;
      }).join('');
      
      tableHTML += '</tbody>';
      document.getElementById('tabla1').innerHTML = tableHTML;
    }

    function filterPortal2(filtro) {
      filtroPortal2 = filtro;
      document.querySelectorAll('#portal2-filters .tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderPortal2();
    }

    function sortPortal2(column) {
      if (sortConfig.portal === 'portal2' && sortConfig.column === column) {
        sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
      } else {
        sortConfig.portal = 'portal2';
        sortConfig.column = column;
        sortConfig.direction = 'asc';
      }
      renderPortal2();
    }

    function renderPortal2() {
      let filtered = filtroPortal2 === 'Todos' ? [...compras] : compras.filter(c => c.estado === filtroPortal2);
      
      // Aplicar filtros de columna
      Object.keys(filterColumnP2).forEach(col => {
        const filterValue = filterColumnP2[col].toLowerCase();
        filtered = filtered.filter(c => String(c[col]).toLowerCase().includes(filterValue));
      });
      
      if (sortConfig.column && sortConfig.portal === 'portal2') {
        filtered.sort((a, b) => {
          let aVal = a[sortConfig.column];
          let bVal = b[sortConfig.column];
          if (typeof aVal === 'string') {
            aVal = aVal.toLowerCase();
            bVal = bVal.toLowerCase();
          }
          if (sortConfig.direction === 'asc') {
            return aVal > bVal ? 1 : aVal < bVal ? -1 : 0;
          } else {
            return aVal < bVal ? 1 : aVal > bVal ? -1 : 0;
          }
        });
      }

      const pendientes = compras.filter(c => c.estado === 'Pendiente Aprobación').length;
      const aprobadas = compras.filter(c => c.estado === 'Aprobada').length;
      const rechazadas = compras.filter(c => c.estado === 'Rechazada').length;
      const criticas = compras.filter(c => c.riesgo === 'Alto').length;

      document.getElementById('kpi-grid-p2').innerHTML = `
        <div class="kpi-card blue"><div class="top"><div><div class="ic">📦</div></div></div><div class="num">${pendientes}</div><div class="lbl">PENDIENTE</div></div>
        <div class="kpi-card green"><div class="top"><div><div class="ic">✓</div></div></div><div class="num">${aprobadas}</div><div class="lbl">APROBADAS</div></div>
        <div class="kpi-card red"><div class="top"><div><div class="ic">✕</div></div></div><div class="num">${rechazadas}</div><div class="lbl">RECHAZADAS</div></div>
        <div class="kpi-card red"><div class="top"><div><div class="ic">⚠️</div></div></div><div class="num">${criticas}</div><div class="lbl">CRÍTICO</div></div>
      `;

      const filterTabs = ['Todos', 'Pendiente Aprobación', 'Aprobada', 'Rechazada'];
      document.getElementById('portal2-filters').innerHTML = filterTabs.map(f => `<button class="tab-btn ${filtroPortal2 === f ? 'active' : ''}" onclick="filterPortal2('${f}')">${f.substring(0, 12)}<span class="cnt">${compras.filter(c => f === 'Todos' || c.estado === f).length}</span></button>`).join('');

      document.getElementById('portal2-filter-controls').innerHTML = `
        <input type="text" class="filter-select" placeholder="ID" onchange="updateColumnFilter('portal2', 'id', this.value)">
        <input type="text" class="filter-select" placeholder="Material" onchange="updateColumnFilter('portal2', 'material', this.value)">
        <input type="text" class="filter-select" placeholder="Proveedor" onchange="updateColumnFilter('portal2', 'proveedorRecomendado.nombre', this.value)">
        <input type="text" class="filter-select" placeholder="Riesgo" onchange="updateColumnFilter('portal2', 'riesgo', this.value)">
      `;

      let tableHTML = `<thead><tr><th></th><th onclick="sortPortal2('id')">ID<span class="sort-indicator">${sortConfig.column === 'id' ? (sortConfig.direction === 'asc' ? '▲' : '▼') : ''}</span></th><th>Material</th><th>Marca</th><th class="num-right">Cant.</th><th class="num-right">Precio</th><th class="num-right">Total</th><th>Fecha</th><th>Proveedor</th><th onclick="sortPortal2('riesgo')">Riesgo<span class="sort-indicator">${sortConfig.column === 'riesgo' ? (sortConfig.direction === 'asc' ? '▲' : '▼') : ''}</span></th><th onclick="sortPortal2('estado')">Estado<span class="sort-indicator">${sortConfig.column === 'estado' ? (sortConfig.direction === 'asc' ? '▲' : '▼') : ''}</span></th></tr></thead><tbody>`;

      tableHTML += filtered.map(c => {
        const expanded = expandedIdCompra === c.id;
        const statusClass = c.estado === 'Aprobada' ? 'badge-success' : c.estado === 'Rechazada' ? 'badge-danger' : 'badge-warning';
        const riskClass = c.riesgo === 'Alto' ? 'badge-danger' : c.riesgo === 'Medio' ? 'badge-warning' : 'badge-success';

        return `<tr class="${expanded ? 'expanded' : ''}" id="row-${c.id}">
          <td><button class="row-toggle" onclick="toggleExpand('${c.id}', 'portal2')">${expanded ? '▼' : '▶'}</button></td>
          <td style="font-weight:700;font-size:11px">${c.id}</td>
          <td><div class="type-chip"><div class="type-ic">${c.thumbnail}</div><span style="max-width:80px;overflow:hidden;text-overflow:ellipsis">${c.material}</span></div></td>
          <td style="max-width:50px;overflow:hidden;text-overflow:ellipsis;font-size:11px">${c.marca}</td>
          <td class="num-right">${c.cantidad}</td>
          <td class="num-right">$${c.precioUnit.toLocaleString()}</td>
          <td class="num-right" style="font-weight:700">$${c.gasto.toLocaleString()}</td>
          <td style="font-size:11px"><strong>${c.fechaDeseada}</strong></td>
          <td style="max-width:100px;overflow:hidden;text-overflow:ellipsis;font-size:11px">${c.proveedorRecomendado.nombre.substring(0, 16)}</td>
          <td><span class="status-badge ${riskClass}">${c.riesgo.substring(0, 3)}</span></td>
          <td><span class="status-badge ${statusClass}">${c.estado.substring(0, 6)}</span></td>
        </tr>
        ${expanded ? `<tr class="detail-row"><td colspan="11"><div class="detail-pane"><div class="ai-suggestion ${c.riesgo === 'Alto' ? 'critical' : ''}"><div class="ai-suggestion-title">${c.riesgo === 'Alto' ? '⚠️ CRÍTICO' : '💡 IA'}</div><div class="ai-suggestion-text">${c.sugerencia}</div></div><div class="detail-section"><h4>Recomendado</h4><div class="provider-cards"><div class="provider-card highlight"><div class="provider-name">${c.proveedorRecomendado.nombre} 🏆</div><div class="provider-price">$${c.proveedorRecomendado.precio}</div><div class="provider-detail">Total: $${(c.proveedorRecomendado.precio * c.cantidad)}</div><div class="provider-detail">Plazo: ${c.proveedorRecomendado.plazo}d | #${c.proveedorRecomendado.ranking}</div><div class="provider-detail">${c.proveedorRecomendado.historial}</div></div></div></div><div class="detail-section"><h4>Opciones</h4><div class="provider-cards">${c.proveedoresAlternativos.map(p => `<div class="provider-card"><div class="provider-name">${p.nombre}</div><div class="provider-price">$${p.precio}</div><div class="provider-detail">Total: $${(p.precio * c.cantidad)}</div><div class="provider-detail">Plazo: ${p.plazo}d | #${p.ranking}</div><div class="provider-detail">${p.historial}</div></div>`).join('')}</div></div>${c.estado === 'Pendiente Aprobación' ? `<div class="actions"><button class="btn btn-approve" onclick="approveCompra('${c.id}')">✓ Aprobar</button><button class="btn btn-reject" onclick="openNoteModal('${c.id}', 'Rechazada', 'portal2')">✕ Rechazar</button></div>` : `<div style="grid-column: 1 / -1; padding: 8px; color: var(--ink-faint); font-size: 11px;">Estado: <strong>${c.estado}</strong>${c.nota ? ` | Nota: ${c.nota}` : ''}</div>`}</div></td></tr>` : ''}`;
      }).join('');
      
      tableHTML += '</tbody>';
      document.getElementById('tabla2').innerHTML = tableHTML;
    }

    function renderPortal3() {
      const totalSolicitudes = solicitudes.length;
      const aprobadas = solicitudes.filter(s => s.estado === 'Aprobada').length;
      const rechazadas = solicitudes.filter(s => s.estado === 'Rechazada').length;
      const pendientes = solicitudes.filter(s => s.estado === 'Pendiente').length;
      const totalGasto = solicitudes.filter(s => s.estado === 'Aprobada').reduce((acc, s) => acc + s.gasto, 0);
      
      document.getElementById('kpi-grid-p3').innerHTML = `
        <div class="kpi-card blue"><div class="top"><div><div class="ic">📋</div></div></div><div class="num">${totalSolicitudes}</div><div class="lbl">SOLICITUDES</div><div class="note">${pendientes} pendientes</div></div>
        <div class="kpi-card green"><div class="top"><div><div class="ic">✓</div></div></div><div class="num">${aprobadas}</div><div class="lbl">APROBADAS</div><div class="note">${Math.round(aprobadas / totalSolicitudes * 100)}%</div></div>
        <div class="kpi-card red"><div class="top"><div><div class="ic">✕</div></div></div><div class="num">${rechazadas}</div><div class="lbl">RECHAZADAS</div><div class="note">del total</div></div>
        <div class="kpi-card yellow"><div class="top"><div><div class="ic">💰</div></div></div><div class="num">$${(totalGasto / 1000).toFixed(0)}K</div><div class="lbl">GASTO</div><div class="note">acumulado</div></div>
      `;

      document.getElementById('charts-container').innerHTML = `
        <div class="chart-card"><h3>Urgentes vs Normales</h3><div class="chart-container"><canvas id="chartUrgency"></canvas></div></div>
        <div class="chart-card"><h3>Gasto por Proveedor</h3><div class="chart-container"><canvas id="chartProvider"></canvas></div></div>
        <div class="chart-card"><h3>Flujo USD (3M)</h3><div class="chart-container"><canvas id="chartFlow"></canvas></div></div>
        <div class="chart-card"><h3>Tendencia Tiempo</h3><div class="chart-container"><canvas id="chartTendency"></canvas></div></div>
      `;

      setTimeout(() => {
        const urgentsCount = solicitudes.filter(s => isUrgent(s.fechaDeseada)).length;
        new Chart(document.getElementById('chartUrgency').getContext('2d'), {
          type: 'doughnut',
          data: { 
            labels: ['Urgentes', 'Normales'], 
            datasets: [{ 
              data: [urgentsCount, totalSolicitudes - urgentsCount], 
              backgroundColor: ['#C0392B', '#1E9E6D'],
              borderColor: '#fff', 
              borderWidth: 2 
            }] 
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });

        const providerGasto = {};
        compras.forEach(c => { const prov = c.proveedorRecomendado.nombre; providerGasto[prov] = (providerGasto[prov] || 0) + c.gasto; });
        new Chart(document.getElementById('chartProvider').getContext('2d'), {
          type: 'bar',
          data: { 
            labels: Object.keys(providerGasto).map(k => k.substring(0, 15)), 
            datasets: [{ 
              label: 'USD', 
              data: Object.values(providerGasto), 
              backgroundColor: '#1C77C3',
              borderRadius: 6 
            }] 
          },
          options: { 
            indexAxis: 'y', 
            responsive: true, 
            maintainAspectRatio: false, 
            plugins: { legend: { display: false } }, 
            scales: { x: { beginAtZero: true, grid: { color: 'var(--border)' } }, y: { grid: { display: false } } } 
          }
        });

        new Chart(document.getElementById('chartFlow').getContext('2d'), {
          type: 'line',
          data: { 
            labels: ['Jun', 'Jul', 'Ago'], 
            datasets: [{ 
              label: 'USD', 
              data: [45000, 67000, 156800], 
              borderColor: '#1C77C3', 
              backgroundColor: 'rgba(28,119,195,0.1)', 
              borderWidth: 3, 
              fill: true, 
              tension: 0.4, 
              pointRadius: 5,
              pointBackgroundColor: '#1C77C3',
              pointBorderColor: '#fff',
              pointBorderWidth: 2
            }] 
          },
          options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            plugins: { legend: { display: false } }, 
            scales: { 
              y: { beginAtZero: true, grid: { color: 'var(--border)' }, ticks: { callback: v => '$' + (v/1000) + 'K' } }, 
              x: { grid: { display: false } } 
            } 
          }
        });

        new Chart(document.getElementById('chartTendency').getContext('2d'), {
          type: 'bar',
          data: { 
            labels: ['Jun', 'Jul', 'Ago'], 
            datasets: [{ 
              label: 'Días', 
              data: [5.2, 4.1, 3.2], 
              backgroundColor: '#1E9E6D',
              borderRadius: 6 
            }] 
          },
          options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            plugins: { legend: { display: false } }, 
            scales: { 
              y: { beginAtZero: true, max: 6, grid: { color: 'var(--border)' } }, 
              x: { grid: { display: false } } 
            } 
          }
        });
      }, 100);
    }

    function updateColumnFilter(portal, column, value) {
      if (portal === 'portal1') {
        if (value) filterColumnP1[column] = value;
        else delete filterColumnP1[column];
        renderPortal1();
      } else {
        if (value) filterColumnP2[column] = value;
        else delete filterColumnP2[column];
        renderPortal2();
      }
    }

    function toggleExpand(id, portal) {
      if (portal === 'portal1') {
        expandedId = expandedId === id ? null : id;
        renderPortal1();
      } else {
        expandedIdCompra = expandedIdCompra === id ? null : id;
        renderPortal2();
      }
    }

    function openNoteModal(id, action, portal) {
      pendingAction = action;
      pendingActionData = { id, portal };
      document.getElementById('modal-title').textContent = `${action === 'Rechazada' ? 'Rechazar' : 'Postergar'} Solicitud`;
      document.getElementById('modal-textarea').value = '';
      document.getElementById('noteModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('noteModal').classList.remove('active');
      pendingAction = null;
      pendingActionData = null;
    }

    function confirmModalAction() {
      const nota = document.getElementById('modal-textarea').value;
      if (pendingActionData.portal === 'portal1') {
        const solped = solicitudes.find(s => s.id === pendingActionData.id);
        if (solped) {
          solped.estado = pendingAction;
          solped.nota = nota;
        }
        renderPortal1();
      } else {
        const compra = compras.find(c => c.id === pendingActionData.id);
        if (compra) {
          compra.estado = pendingAction;
          compra.nota = nota;
        }
        renderPortal2();
      }
      closeModal();
    }

    function updateEstado(id, nuevoEstado) {
      const solped = solicitudes.find(s => s.id === id);
      if (solped) solped.estado = nuevoEstado;
      renderPortal1();
    }

    function approveCompra(id) {
      const compra = compras.find(c => c.id === id);
      if (compra) compra.estado = 'Aprobada';
      expandedIdCompra = null;
      renderPortal2();
    }

    renderPortal1();
  </script>
</body>
</html>
